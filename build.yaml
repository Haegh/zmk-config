#    shield: settings_reset
#    snippet: studio-rpc-usb-uart
#  - board: corne_choc_pro_right
#    shield: settings_reset
#    snippet: studio-rpc-usb-uart

  - board: piantor_pro_bt_left//zmk
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_left
  - board: piantor_pro_bt_right//zmk
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_right

  # DIAGNOSTIC (iii): no canvas objects, listeners active (bisects canvas vs events)
  - board: piantor_pro_bt_left//zmk
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_SHARP_MIP_WIDGET_NO_CANVAS=y
    artifact-name: piantor_pro_bt_left_nocanvas

  # DIAGNOSTIC (iv): canvases present, no event listeners (bisects events vs canvas)
  - board: piantor_pro_bt_left//zmk
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_SHARP_MIP_WIDGET_NO_EVENTS=y
    artifact-name: piantor_pro_bt_left_noevents

  # DIAGNOSTIC (v): full widgets, large display thread stack (tests stack overflow)
  - board: piantor_pro_bt_left//zmk
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
    artifact-name: piantor_pro_bt_left_bigstack

  - board: piantor_pro_bt_left//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: piantor_pro_bt_right//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart

